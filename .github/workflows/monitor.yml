name: live-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 恢复状态
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: 运行监控
        env:
          STREAMERS: ${{ secrets.STREAMERS }}
          QQ_EMAIL_SENDER: ${{ secrets.QQ_EMAIL_SENDER }}
          QQ_EMAIL_AUTH: ${{ secrets.QQ_EMAIL_AUTH }}
          QQ_EMAIL_RECEIVER: ${{ secrets.QQ_EMAIL_RECEIVER }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python monitor.py

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: live-state-${{ github.run_id }}
